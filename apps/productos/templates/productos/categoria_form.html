{% extends 'home/base.html' %}

{% block TITULO %}
    <h1>Crear / actualizar categoría</h1>
{% endblock TITULO %}

{% block BODY %}
<div class="container">
    <div class="lt-form-card">
        <form method="post" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            {{ form.as_p }}
            <div class="d-flex gap-2 mt-3">
                <button type="submit" class="btn btn-lt px-4">Guardar</button>
                <a href="{% url 'productos:categoria_list' %}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock BODY %}
