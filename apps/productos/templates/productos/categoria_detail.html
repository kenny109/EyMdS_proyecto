{% extends 'home/base.html' %}
{% load static %}

{% block TITULO %}
    <h1>Detalle Categorías de Productos</h1>
{% endblock TITULO %}

{% block BODY %}
<div class="d-flex justify-content-center">
    <div class="col-sm-6 col-md-4 col-lg-3">
        <div>
            <div class="card h-100 m-2">
                <div class="card-body bg-black">
                    <h2 class="card-title text-light">{{categoria.nombre}} </h2>
                    <h5 class="card-text text-warning">{{categoria.descripcion}}</h5>
                    <img class="img-fluid img-thumbnail rounded mx-auto d-block" src="{% if object.imagen %}{{ object.imagen.url }}{% else %}{% static 'Home/img/sinfoto.png' %}{% endif %}" alt="Imagen"></img>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="d-flex justify-content-center gap-2 my-4">
    <a class="btn btn-outline-dark" href="{% url 'productos:categoria_list' %}"><i class="bi bi-arrow-left"></i> Volver atrás</a>
    <a class="btn btn-lt" href="{% url 'productos:index' %}?categoria={{ object.id }}">Ver productos de esta categoría</a>
</div>
{% endblock BODY %}
