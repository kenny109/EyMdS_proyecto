{# Vista previa de tiendas en la página de inicio (MR-117). La pantalla completa está en home/tiendas_page.html #}
<section class="lt-section pt-0" id="tiendas">
    <div class="container">
        <div class="lt-section-head">
            <div>
                <span class="lt-eyebrow">Visítanos</span>
                <h2>Nuestras tiendas</h2>
            </div>
            <a href="{% url 'Home:tiendas' %}" class="btn btn-link text-dark fw-semibold">Ver mapa y horarios <i class="bi bi-arrow-right"></i></a>
        </div>
        <div class="row g-3 g-md-4">
            {% for t in tiendas %}
            <div class="col-md-6 col-lg-4">{% include 'home/_tienda_card.html' with t=t %}</div>
            {% endfor %}
        </div>
    </div>
</section>
