{% extends 'home/password/_card.html' %}
{% block titulo_pagina %}Cambiar contraseña{% endblock %}
{% block tarjeta %}
<div class="lt-auth-icon"><i class="bi bi-key"></i></div>
<h1 class="h3 text-center fw-bold mb-1">Cambiar contraseña</h1>
<p class="text-center text-muted mb-4">Por seguridad, primero confirma tu contraseña actual.</p>
<form method="post" novalidate>
    {% csrf_token %}
    {% include 'home/password/_campos.html' %}
    <button type="submit" class="btn btn-lt btn-lg w-100">Guardar contraseña</button>
</form>
{% endblock %}
